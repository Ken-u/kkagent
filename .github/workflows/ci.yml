name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing v-prefixed tag to rebuild
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Resolve release state
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Resolve version and release state
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "workspace.package.version is missing" >&2
            exit 1
          fi
          release_tag=${REQUESTED_TAG:-v$version}
          if [ "$release_tag" != "v$version" ]; then
            echo "requested tag $release_tag does not match workspace version $version" >&2
            exit 1
          fi
          release_sha=$(git rev-parse HEAD)
          should_release=true
          if gh release view "$release_tag" >/dev/null 2>&1 && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            should_release=false
            echo "$release_tag already exists; skipping duplicate automatic release"
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate Unix installer syntax
        run: sh -n install.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  msrv:
    name: Rust 1.88 minimum version
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result != 'failure' && (needs.prepare.result == 'skipped' || needs.prepare.outputs.should_release != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88
      - run: cargo check --workspace --all-targets --locked

  native-platforms:
    name: ${{ matrix.name }}
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result != 'failure' && (needs.prepare.result == 'skipped' || needs.prepare.outputs.should_release != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x86_64
            os: macos-15-intel
          - name: macOS arm64
            os: macos-14
          - name: Windows x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: cargo check --workspace --all-targets --locked

  linux-musl:
    name: Linux musl static check
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result != 'failure' && (needs.prepare.result == 'skipped' || needs.prepare.outputs.should_release != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: Linux arm64 musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.target }}
      - run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  windows-arm64:
    name: Windows arm64 native check
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result != 'failure' && (needs.prepare.result == 'skipped' || needs.prepare.outputs.should_release != 'true') }}
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-pc-windows-msvc
      - run: cargo check --workspace --target aarch64-pc-windows-msvc --locked

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (musl)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar
          - name: Linux arm64 (musl)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar
            musl: true
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: tar
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl == true
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/kkagent" dist/package/
          cp README.md LICENSE install.sh dist/package/
          tar -C dist/package -czf "dist/kkagent-${{ matrix.target }}.tar.gz" .
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kkagent.exe" dist/package/
          Copy-Item README.md, LICENSE, install.ps1 dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/kkagent-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: kkagent-${{ matrix.target }}
          path: dist/kkagent-*
          if-no-files-found: error

  publish:
    name: Publish signed release
    needs:
      - prepare
      - build
      - quality
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.quality.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: dist
        run: sha256sum kkagent-* > SHA256SUMS
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksum manifest with GitHub OIDC
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "release tag must start with v" >&2; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" --generate-notes --title "$RELEASE_TAG"
          fi

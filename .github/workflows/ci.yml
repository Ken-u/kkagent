name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88
      - run: cargo check --workspace --all-targets --locked

  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install runtime test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate Unix installer syntax
        run: sh -n install.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  native-platforms:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Linux arm64
            os: ubuntu-24.04-arm
          - name: macOS x86_64
            os: macos-15-intel
          - name: macOS arm64
            os: macos-14
          - name: Windows x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: cargo check --workspace --all-targets --locked

  linux-musl:
    name: Linux musl static check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: Linux arm64 musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.target }}
      - run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  windows-arm64:
    name: Windows arm64 native check
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - run: rustup target add aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-pc-windows-msvc
      - run: cargo check --workspace --target aarch64-pc-windows-msvc --locked

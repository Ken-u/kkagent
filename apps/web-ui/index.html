<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kkagent Web UI</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #151b23;
      --surface-hover: #1c242e;
      --elevated: #212830;
      --border: #30363d;
      --border-strong: #3d444d;
      --text: #e6edf3;
      --text-secondary: #7d8590;
      --accent: #2f81f7;
      --accent-hover: #388bfd;
      --danger: #f85149;
      --success: #3fb950;
      --warning: #f0883e;
      --shadow: 0 8px 24px rgba(0,0,0,0.35);
      --radius: 12px;
      --radius-sm: 8px;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      overflow: hidden;
      transition: grid-template-columns .2s ease;
    }
    body.sidebar-collapsed { grid-template-columns: 0 1fr; }

    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100vh;
      overflow: hidden;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #a371f7);
      display: grid; place-items: center;
      font-weight: 800; font-size: 13px; color: #fff;
    }
    .brand h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .brand .version { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
    .brand-copy { min-width: 0; flex: 1; }
    .sidebar-collapse {
      margin-left: auto;
      width: 28px; height: 28px; padding: 0;
      display: grid; place-items: center;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
    }
    .sidebar-collapse:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border); }
    .sidebar-expand {
      display: none;
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 12;
      width: 22px;
      height: 64px;
      padding: 0;
      border-radius: 0 10px 10px 0;
      background: var(--elevated);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-left: 0;
      box-shadow: var(--shadow);
    }
    body.sidebar-collapsed .sidebar-expand { display: grid; place-items: center; }
    body.sidebar-collapsed #sidebar {
      overflow: hidden;
      border-right: 0;
      pointer-events: none;
    }
    #status {
      padding: 8px 16px; font-size: 12px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #status.online { color: var(--success); }
    #status.offline { color: var(--danger); }
    .sidebar-actions {
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px 14px;
      flex-shrink: 0;
    }
    button {
      font: inherit; border: 0; border-radius: var(--radius-sm);
      padding: 9px 12px; cursor: pointer;
      transition: background .15s, transform .05s;
    }
    button:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--elevated); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    #searchBox {
      margin: 0 14px 10px;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 9px 12px; font: inherit; outline: none;
    }
    #searchBox:focus { border-color: var(--accent); }
    .workspace-tabs {
      display: flex; align-items: center; gap: 4px;
      margin: 0 14px 10px; padding: 3px;
      background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .workspace-tab {
      flex: 1; text-align: center; padding: 5px 8px; font-size: 12px; cursor: pointer;
      color: var(--text-secondary); border-radius: 6px; transition: background .15s, color .15s;
    }
    .workspace-tab:hover { color: var(--text); }
    .workspace-tab.active { background: var(--elevated); color: var(--text); }
    #sessions { flex: 1; overflow: auto; padding: 0 8px 12px; min-height: 0; }
    .session {
      padding: 8px 10px 8px 12px; border-radius: var(--radius-sm);
      cursor: pointer; color: var(--text-secondary); font-size: 13px;
      display: flex; flex-direction: column; gap: 2px;
      transition: background .15s, color .15s; margin-bottom: 1px;
      position: relative;
    }
    .session::before {
      content: "";
      position: absolute; left: 6px; top: 0; bottom: 0;
      width: 1px; background: var(--border);
    }
    .session[data-depth="0"]::before { display: none; }
    .session-expander, .session-expander-spacer {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; font-size: 11px; color: var(--text-secondary);
      flex: 0 0 auto;
    }
    .session-expander:hover { color: var(--text); }
    .session-fork-icon {
      color: var(--text-secondary); margin-right: 4px; font-size: 11px;
    }
    .session:hover { background: var(--surface-hover); color: var(--text); }
    .session.active { background: var(--elevated); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
    .session-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; }
    .session-path { font-size: 10px; color: var(--text-secondary); padding-left: 18px; margin-top: -2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-meta { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 18px; }
    .session-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .session-item-actions {
      display: none; align-items: center; gap: 2px; flex-shrink: 0; margin-left: auto;
    }
    .session:hover .session-item-actions, .session.active .session-item-actions { display: flex; }
    .session-icon-btn {
      width: 22px; height: 22px; padding: 0; border-radius: 6px;
      background: transparent; color: var(--text-secondary);
      display: grid; place-items: center;
    }
    .session-icon-btn:hover { background: var(--elevated); color: var(--text); }
    .session-icon-btn.danger:hover { color: var(--danger); background: rgba(248,81,73,0.12); }
    .session-rename-input {
      flex: 1; min-width: 0;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--accent); border-radius: 6px;
      padding: 2px 6px; font: inherit; font-size: 13px; outline: none;
    }

    main { display: flex; flex-direction: column; min-width: 0; background: var(--bg); height: 100vh; overflow: hidden; }
    #sessionBar {
      display: none;
      align-items: center; gap: 10px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      position: relative;
      min-height: 48px;
    }
    #sessionBar.active { display: flex; }
    .session-bar-title { flex: 1; min-width: 0; }
    #sessionTitle {
      width: 100%;
      background: transparent; color: var(--text);
      border: 1px solid transparent; border-radius: 8px;
      padding: 6px 8px; font: inherit; font-weight: 600; font-size: 14px;
      outline: none;
    }
    #sessionTitle:hover { border-color: var(--border); }
    #sessionTitle:focus { border-color: var(--accent); background: var(--bg); }
    .session-bar-meta {
      font-size: 11px; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 180px;
    }
    .session-bar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    #permissionMode {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 8px; font: inherit; font-size: 12px; outline: none;
    }
    #planBtn.active {
      background: rgba(47,129,247,0.16);
      border-color: var(--accent);
      color: var(--text);
    }
    #sendBtn .stop-icon { display: none; }
    #sendBtn.running {
      background: rgba(248,81,73,0.14);
      border-color: rgba(248,81,73,0.35);
      color: var(--danger);
    }
    #sendBtn.running:hover { background: rgba(248,81,73,0.22); }
    #sendBtn.running .send-icon { display: none; }
    #sendBtn.running .stop-icon { display: block; }
    #sessionMenu {
      display: none;
      position: absolute; top: calc(100% - 6px); right: 12px;
      background: var(--elevated);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      min-width: 160px;
      z-index: 20;
      overflow: hidden;
    }
    #sessionMenu.active { display: flex; flex-direction: column; padding: 4px; }
    #sessionMenu button {
      background: transparent; color: var(--text);
      text-align: left; border-radius: 6px; font-size: 13px; padding: 8px 10px;
    }
    #sessionMenu button:hover { background: var(--surface-hover); }
    #sessionMenu button.danger { color: var(--danger); }
    #logWrap { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
    #log { flex: 1; overflow: auto; padding: 24px 24px 8px; min-height: 0; }
    #log.is-history .message { animation: none; }
    #jumpBottom {
      display: none;
      position: absolute; right: 24px; bottom: 16px;
      align-items: center; gap: 6px;
      background: var(--elevated); color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      box-shadow: var(--shadow);
      z-index: 4;
    }
    #jumpBottom.visible { display: inline-flex; }
    #jumpBottom:hover { border-color: var(--accent); }
    .welcome {
      max-width: 560px; margin: 10vh auto;
      text-align: center; color: var(--text-secondary);
    }
    .welcome h2 { color: var(--text); font-size: 26px; margin-bottom: 12px; font-weight: 600; }
    .welcome p { margin: 0 0 24px; line-height: 1.6; }
    .samples { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .sample {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 16px; font-size: 13px; color: var(--text-secondary); cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .sample:hover { border-color: var(--accent); color: var(--text); }

    .message {
      display: flex; gap: 14px;
      margin-bottom: 18px;
      animation: fadeIn .25s ease;
      justify-content: flex-start;
    }
    .message.is-live { animation: none; }
    .message.user { flex-direction: row-reverse; justify-content: flex-start; }
    .bubble-md { max-width: 100%; }
    .bubble-md > *:first-child { margin-top: 0; }
    .md-table-wrap { overflow-x: auto; margin: 10px 0; max-width: 100%; }
    .bubble table { width: max-content; min-width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 13px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      flex-shrink: 0; display: grid; place-items: center;
      font-size: 14px; font-weight: 700; color: #fff;
    }
    .avatar.user { background: linear-gradient(135deg, var(--accent), #5cadff); }
    .avatar.assistant { background: linear-gradient(135deg, #7d3cff, #a371f7); }
    .avatar.system { background: var(--warning); }
    .message-body { min-width: 0; padding-top: 3px; max-width: min(92%, 900px); }
    .message.user .message-body { display: flex; flex-direction: column; align-items: flex-end; }
    .message-header {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 4px; font-size: 13px;
    }
    .message.user .message-header { flex-direction: row-reverse; }
    .role-name { font-weight: 600; color: var(--text); }
    .timestamp { color: var(--text-secondary); font-size: 11px; margin-right: auto; }
    .message.user .timestamp { margin-right: 0; margin-left: auto; }
    .bubble {
      background: transparent; border: 1px solid transparent;
      border-radius: var(--radius); padding: 2px 0;
      color: var(--text);
      overflow-wrap: break-word;
      width: fit-content;
      max-width: 100%;
    }
    .message.assistant .bubble { padding: 2px 0; }
    .message.user .bubble {
      background: linear-gradient(135deg, rgba(47,129,247,0.22), rgba(92,173,255,0.18));
      border-color: rgba(92,173,255,0.45);
      padding: 12px 16px; text-align: left;
      border-bottom-right-radius: 4px;
    }
    .message.system .bubble {
      background: rgba(240,136,62,0.10);
      border-color: rgba(240,136,62,0.25);
      padding: 10px 14px;
    }
    .bubble p { margin: 0 0 10px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble pre {
      background: #0a0c10; border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 36px 14px 12px; overflow: auto;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px; line-height: 1.5; margin: 10px 0;
      white-space: pre; word-wrap: normal;
    }
    .bubble pre code { color: inherit; background: transparent; padding: 0; }
    .bubble code {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px; background: rgba(255,255,255,0.08);
      padding: 2px 5px; border-radius: 5px; color: #ff7b72;
    }
    .bubble ul, .bubble ol { margin: 8px 0; padding-left: 22px; }
    .bubble li { margin: 4px 0; }
    .bubble blockquote {
      border-left: 3px solid var(--accent); margin: 10px 0;
      padding: 4px 14px; color: var(--text-secondary);
    }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4, .bubble h5, .bubble h6 {
      margin: 14px 0 8px;
      line-height: 1.3;
      font-weight: 650;
    }
    .bubble h1 { font-size: 22px; }
    .bubble h2 { font-size: 18px; }
    .bubble h3 { font-size: 16px; }
    .bubble hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; }
    .bubble th { background: var(--surface); }
    .bubble a { color: var(--accent); text-decoration: none; }
    .bubble a:hover { text-decoration: underline; }

    .copy-btn {
      background: transparent;
      color: var(--text-secondary);
      border: 0;
      border-radius: var(--radius-sm);
      padding: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, color .15s;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .msg-actions {
      display: flex; align-items: center; gap: 4px;
      opacity: 0;
      transition: opacity .15s;
      margin-top: 6px;
    }
    .message:hover .msg-actions { opacity: 1; }
    .message.user .msg-actions { justify-content: flex-end; }

    .thinking {
      margin: 0 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.03);
      color: var(--text-secondary);
      font-size: 13px;
      width: fit-content;
      max-width: 100%;
    }
    .thinking.is-live { border-color: rgba(163,113,247,0.45); }
    .thinking summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      user-select: none;
    }
    .thinking summary::-webkit-details-marker { display: none; }
    .thinking summary::before {
      content: "";
      width: 6px;
      height: 6px;
      border-right: 1.8px solid currentColor;
      border-bottom: 1.8px solid currentColor;
      transform: rotate(-45deg);
      transition: transform .15s;
    }
    .thinking[open] summary::before { transform: rotate(45deg); }
    .thinking.is-live summary { color: #c4b5fd; }
    .thinking-body {
      padding: 0 12px 10px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      max-height: 280px;
      overflow: auto;
      color: var(--text-secondary);
    }

    /* ---- Tool call steps ---- */
    .tool-group {
      margin: 12px 0 4px;
      background: rgba(255,255,255,0.015);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .tool-group-label {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: .06em;
      padding: 5px 10px;
      background: rgba(255,255,255,0.025);
      border-bottom: 1px solid var(--border);
    }
    .tool-group-label .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    .tool-group.has-error .tool-group-label .dot { background: var(--danger); }
    .tool-group.is-running .tool-group-label .dot { background: var(--warning); animation: toolPulse 1.6s ease-in-out infinite; }
    .tool-call {
      border-radius: 0;
      border-bottom: 1px solid var(--border);
    }
    .tool-call:last-child { border-bottom: none; }
    .tool-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px;
      cursor: pointer; user-select: none;
      transition: background .12s;
      min-width: 0;
    }
    .tool-row:hover { background: rgba(255,255,255,0.03); }
    .tool-call.open .tool-row { background: rgba(47,129,247,0.05); }
    .tool-call.error .tool-row { background: rgba(248,81,73,0.05); }
    .tool-call.error.open .tool-row { background: rgba(248,81,73,0.09); }
    .tool-call.running .tool-row { background: rgba(240,166,49,0.05); }
    .tool-status-icon {
      width: 15px; height: 15px; flex-shrink: 0;
      display: grid; place-items: center;
      color: var(--text-secondary);
    }
    .tool-call.success .tool-status-icon { color: var(--success); }
    .tool-call.error .tool-status-icon { color: var(--danger); }
    .tool-call.running .tool-status-icon { color: var(--warning); }
    .spin { display: inline-grid; place-items: center; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tool-verb {
      font-size: 11px; font-weight: 600; flex-shrink: 0; letter-spacing: .01em;
      color: var(--text-secondary);
    }
    .tool-arg {
      font-family: var(--mono);
      font-size: 11.5px; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto;
    }
    .tool-meta { flex-shrink: 0; font-size: 10.5px; color: var(--text-secondary); font-family: var(--mono); }
    .tool-chevron {
      width: 14px; height: 14px; flex-shrink: 0;
      display: grid; place-items: center;
      color: var(--text-secondary);
      transition: transform .2s;
    }
    .tool-call.open .tool-chevron { transform: rotate(90deg); }

    .tool-detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
    .tool-call.open .tool-detail { grid-template-rows: 1fr; }
    .tool-detail-inner { overflow: hidden; min-height: 0; }
    .tool-detail-content {
      padding: 8px 12px 10px;
      background: #0a0c10;
      border-top: 1px solid var(--border);
    }
    .tool-sec { margin-bottom: 8px; }
    .tool-sec:last-child { margin-bottom: 0; }
    .tool-sec-title {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--text-secondary); margin-bottom: 4px;
    }
    .tool-sec-title .copy-btn { margin-left: auto; }
    .tool-name-pill {
      font-family: var(--mono); font-size: 10.5px; color: var(--text-secondary);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 999px;
    }
    .kv-list { display: flex; flex-direction: column; }
    .kv-row {
      display: grid; grid-template-columns: 88px minmax(0, 1fr);
      gap: 10px; align-items: baseline; padding: 1px 0;
    }
    .kv-key {
      font-family: var(--mono); font-size: 11px; color: var(--text-secondary);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .kv-val {
      margin: 0; font-family: var(--mono); font-size: 11px; line-height: 1.4; color: var(--text);
      word-break: break-all;
      max-height: 160px; overflow: auto;
    }
    .kv-empty { font-size: 11px; color: var(--text-secondary); }
    .bubble .tool-output {
      margin: 0;
      background: #050608;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: var(--mono); font-size: 11px; line-height: 1.4;
      word-break: break-all; overflow: auto; max-height: 240px;
      color: var(--text-secondary);
    }
    .j-key { color: #79c0ff; }
    .j-str { color: #a5d6ff; }
    .j-num { color: #f2cc60; }
    .j-bool { color: #ff7b72; }
    .bubble .tool-error-text {
      background: rgba(248,81,73,0.08);
      border: 1px solid rgba(248,81,73,0.35);
      color: #ffa198;

    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; }
      aside { position: fixed; inset: 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; height: 100vh; }
      aside.open { transform: translateX(0); }
      #btwPanel { width: calc(100vw - 32px); height: 60vh; right: 16px; bottom: 170px; }
      #btwFab { bottom: 100px; right: 16px; }
      .menu-toggle {
        display: grid; place-items: center; width: 34px; height: 34px;
        background: var(--elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);
        color: var(--text); position: fixed; top: 10px; left: 10px; z-index: 11;
      }
      .sidebar-collapse, .sidebar-expand { display: none !important; }
      body.sidebar-collapsed { grid-template-columns: 1fr; }
      body.sidebar-collapsed #sidebar { pointer-events: auto; border-right: 1px solid var(--border); }
      .brand { padding-left: 50px; }
      #log { padding: 18px 16px 6px; }
      #sessionBar { padding: 10px 16px 10px 52px; }
      #jumpBottom { right: 16px; }
      .composer-wrap { padding: 12px 16px 16px; }

         never covers the transcript. Tap ⤢ to expand. */

      .todo-pop-body { max-height: 38px; }
      .todo-popover.expanded .todo-pop-body { max-height: 50vh; }

    .side-panel-close { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; }
    .side-panel-body { padding: 12px 16px; overflow: auto; flex: 1; font-size: 13px; }
    /* Todo popover: floats above the composer, right-aligned (PC) */
    .todo-popover {
      display: none;
      position: absolute; right: 24px; bottom: calc(100% + 6px);
      width: min(420px, calc(100vw - 48px));
      background: var(--surface); border: 1px solid var(--border-strong);
      border-radius: var(--radius); box-shadow: var(--shadow);
      z-index: 40; flex-direction: column; overflow: hidden;
    }
    .todo-popover.open { display: flex; }
    .todo-pop-header {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; font-size: 12px; font-weight: 600;
      border-bottom: 1px solid var(--border); cursor: default;
    }
    .todo-pop-title { flex: 1; }
    .todo-pop-count { color: var(--text-secondary); font-weight: 400; }
    .todo-pop-toggle, .todo-pop-close {
      background: none; border: none; color: var(--text-secondary);
      font-size: 14px; cursor: pointer; padding: 0 2px; line-height: 1;
    }
    .todo-pop-toggle:hover, .todo-pop-close:hover { color: var(--text); }
    .todo-pop-body { overflow: auto; padding: 6px 10px; font-size: 13px; max-height: 132px; }
    .todo-popover.expanded .todo-pop-body { max-height: min(50vh, 420px); }
    .todo-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .todo-list li { display: flex; align-items: baseline; gap: 8px; line-height: 1.45; color: var(--text-secondary); }
    .todo-list .todo-mark { flex-shrink: 0; }
    .todo-list .todo-done { color: var(--text-secondary); text-decoration: line-through; opacity: 0.6; }
    .todo-list .todo-active { color: var(--text); font-weight: 600; }
    .todo-list .todo-active .todo-mark { color: var(--accent); }
    .todo-list .todo-empty { justify-content: center; padding: 8px 0; color: var(--text-secondary); }
    .subagent-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .plan-path { font-family: var(--mono, monospace); font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    .subagent-list li { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .subagent-list .sub-running { color: var(--text); }
    .subagent-list .sub-done { opacity: 0.6; }
    .subagent-list .sub-failed { color: var(--danger, #e0503f); }
    .sub-desc { font-weight: 600; }
    .sub-detail { color: var(--text-secondary); font-size: 12px; max-height: 3em; overflow: hidden; }

    .plugin-list, .plugin-mkt-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .plugin-item { display: flex; justify-content: space-between; gap: 10px; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
    .plugin-item.disabled .plugin-name { opacity: 0.6; }
    .plugin-name { font-weight: 600; }
    .plugin-name small { font-weight: 400; color: var(--text-secondary); }
    .plugin-desc { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
    .plugin-diag { color: var(--danger, #e0503f); font-size: 12px; margin-top: 4px; }
    .plugin-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .plugin-section-title { font-weight: 600; margin: 12px 0 8px; }
    .plugin-empty, .plugin-loading { color: var(--text-secondary); padding: 8px 0; }
    .plugin-mkt { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .plugin-mkt small { color: var(--text-secondary); font-family: var(--mono, monospace); font-size: 11px; }
    .plugin-add-mkt, .plugin-install-src, .plugin-browse-bar { display: flex; gap: 6px; margin: 8px 0; }
    .plugin-add-mkt input, .plugin-install-src input { flex: 1; }
    .btn-mini { font-size: 12px; padding: 3px 10px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; }
    .btn-mini:disabled { opacity: 0.5; cursor: default; }
    .btn-mini-danger { color: var(--danger, #e0503f); border-color: var(--danger, #e0503f); }
  </style>
</head>
<body>
  <div id="tokenGate">
    <div class="card">
      <h2>需要访问令牌</h2>
      <p>该服务已启用鉴权。请输入启动 server 时打印的 HTTP token，或在 URL 中带上 <code>?token=…</code>。</p>
      <form id="tokenForm">
        <input id="tokenInput" placeholder="粘贴 token…" autocomplete="off" />
        <button type="submit" class="btn-primary">连接</button>
      </form>
      <div id="tokenHint"></div>
    </div>
  </div>

  <button class="menu-toggle" id="menuToggle" aria-label="Open sidebar">☰</button>
  <button type="button" class="sidebar-expand" id="sidebarExpand" title="展开会话列表" aria-label="展开会话列表">›</button>

  <aside id="sidebar">
    <div class="brand">
      <div class="brand-icon">K</div>
      <div class="brand-copy">
        <h1>kkagent</h1>
        <div class="version">Web UI</div>
      </div>
      <button type="button" class="sidebar-collapse" id="sidebarCollapse" title="收起会话列表" aria-label="收起会话列表">‹</button>
    </div>
    <div id="status">connecting…</div>
    <div class="sidebar-actions">
      <button id="newSession" class="btn-primary">+ 新会话</button>
      <button id="timelineBtn" class="btn-secondary">查看 Timeline</button>
    </div>
    <div class="workspace-tabs" id="workspaceTabs">
      <div class="workspace-tab active" data-scope="workspace">Workspace</div>
      <div class="workspace-tab" data-scope="global">Global</div>
    </div>
    <input id="searchBox" placeholder="搜索会话…" />
    <div id="sessions"></div>
  </aside>

  <main>
    <header id="sessionBar">
      <div class="session-bar-title">
        <input id="sessionTitle" maxlength="80" placeholder="会话标题" />
      </div>
      <div class="session-bar-meta" id="sessionMeta"></div>
      <div class="session-bar-actions">
        <select id="permissionMode" title="权限模式">
          <option value="manual">manual</option>
          <option value="yolo">yolo</option>
          <option value="auto">auto</option>
        </select>
        <button type="button" id="pluginsBtn" class="btn-secondary" title="插件管理">插件</button>
        <button type="button" id="moreBtn" class="composer-action" title="更多" aria-label="更多">⋯</button>
      </div>
      <div id="sessionMenu">
        <button type="button" data-action="usage-dashboard">Token 用量图表</button>
        <button type="button" data-action="rename">重命名</button>
        <button type="button" data-action="fork">Fork</button>
        <button type="button" data-action="compact">Compact</button>
        <button type="button" data-action="undo">Undo</button>
        <button type="button" data-action="export">导出</button>
        <button type="button" data-action="archive">归档</button>
        <button type="button" data-action="delete" class="danger">删除</button>
      </div>
    </header>
    <div id="noticeBar">
      <span id="noticeText"></span>
      <div class="notice-actions" id="noticeActions"></div>
    </div>
    <div id="logWrap">
      <div id="log"></div>
      <button type="button" id="jumpBottom">↓ 最新</button>
    </div>
    <div class="composer-wrap">
      <div class="composer-toolbar" id="composerToolbar">
        <button type="button" id="planBtn" class="btn-secondary" title="Plan 模式">Plan</button>
        <button type="button" id="todoBtn" class="btn-secondary" title="任务清单">任务</button>
      </div>
      <form id="composer">
        <div class="composer-left">
          <div id="attachmentRow" class="attachment-row"></div>
          <textarea id="prompt" rows="1" placeholder="给 kkagent 发送消息…"></textarea>
        </div>
        <div id="cmdPalette"></div>
        <div class="composer-actions">
          <select id="modelSelect" title="切换模型" aria-label="切换模型">
            <option value="">模型</option>
          </select>
          <input type="file" id="fileInput" accept="image/*,.txt,.md,.rs,.js,.json,.toml,.yaml,.yml,.py" multiple />
          <button type="button" id="attachBtn" class="composer-action" title="添加附件 / 截图 (Ctrl+V)" aria-label="添加附件">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          </button>
          <button type="submit" id="sendBtn" aria-label="Send" title="发送 (Enter)">
            <svg class="send-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            <svg class="stop-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>
          </button>
        </div>
      </form>
      <div class="composer-hint">Enter 发送 · Shift+Enter 换行 · / 命令 · Esc 停止</div>
    </div>
  </main>

  <aside id="timelinePanel">
    <div class="timeline-header">
      <div>
        <h2>Timeline</h2>
        <p>从一次用户输入到下一次输入之间的全部文件 diff，可恢复到该轮结束时的代码。</p>
      </div>
      <button id="timelineClose" class="btn-secondary">×</button>
    </div>
    <div id="timelineList"></div>
  </aside>

  <button id="btwFab" title="打开 BTW 追问">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
  </button>

  <aside id="btwPanel">
    <div class="btw-header">
      <h2>BTW 追问</h2>
      <button id="btwClose" class="btn-secondary">×</button>
    </div>
    <div class="btw-context">
      <div class="btw-context-title">上下文</div>
      <div class="btw-context-body" id="btwContext"></div>
    </div>
    <div id="btwLog"></div>
    <div class="btw-composer">
      <form id="btwForm">
        <textarea id="btwPrompt" rows="1" placeholder="追问…"></textarea>
        <button type="submit" id="btwSend" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
    </div>
  </aside>

  <div id="confirmModal">
    <div class="card">
      <h2 id="confirmTitle">确认</h2>
      <p id="confirmBody"></p>
      <div class="confirm-actions">
        <button type="button" id="confirmCancel" class="btn-secondary">取消</button>
        <button type="button" id="confirmOk" class="btn-danger">删除</button>
      </div>
    </div>
  </div>

  <div id="promptModal">
    <div class="card">
      <h2 id="promptTitle">需要批准</h2>
      <div id="promptBody"></div>
      <div id="promptExtra"></div>
      <div id="promptActions"></div>
    </div>
  </div>

  <script src="/ui/app.js"></script>
</body>
</html>

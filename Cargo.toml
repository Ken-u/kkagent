[workspace]
resolver = "2"
members = [
    "crates/kkagent",
    "crates/kkagent-protocol",
    "crates/kkagent-rpc",
    "crates/kkagent-config",
    "crates/kkagent-llm",
    "crates/kkagent-core",
    "crates/kkagent-tools",
    "crates/kkagent-mcp",
    "crates/kkagent-client",
    "crates/kkagent-tui",
    "crates/kkagent-di",
    "crates/kkagent-wire",
    "crates/kkagent-telemetry",
    "crates/kkagent-acp",
    "crates/kkagent-oauth",
    "crates/kkagent-kaos",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# HTTP / Streaming
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "rustls-tls",
    "rustls-tls-webpki-roots",
] }
reqwest-eventsource = "0.6"
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3"

# File system
ignore = "0.4"
globset = "0.4"
walkdir = "2"
which = "7"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# MCP
rmcp = { version = "3.1", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-async-rw",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "client-side-sse",
    "auth",
    "reqwest",
] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
async-trait = "0.1"
bytes = "1"
pin-project-lite = "0.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
dotenvy = "0.15"
rpassword = "7.5"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp", "bmp"] }

# HTTP / WebSocket server
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio-tungstenite = "0.26"

# Internal crates
kkagent-protocol = { path = "crates/kkagent-protocol" }
kkagent-rpc = { path = "crates/kkagent-rpc" }
kkagent-config = { path = "crates/kkagent-config" }
kkagent-llm = { path = "crates/kkagent-llm" }
kkagent-core = { path = "crates/kkagent-core" }
kkagent-tools = { path = "crates/kkagent-tools" }
kkagent-mcp = { path = "crates/kkagent-mcp" }
kkagent-client = { path = "crates/kkagent-client" }
kkagent-tui = { path = "crates/kkagent-tui" }
kkagent-di = { path = "crates/kkagent-di" }
kkagent-wire = { path = "crates/kkagent-wire" }
kkagent-telemetry = { path = "crates/kkagent-telemetry" }
kkagent-acp = { path = "crates/kkagent-acp" }
kkagent-oauth = { path = "crates/kkagent-oauth" }
kkagent-kaos = { path = "crates/kkagent-kaos" }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false
